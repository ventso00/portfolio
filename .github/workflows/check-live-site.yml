name: Vérifier les hébergements du portfolio

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Vérifier la V2 hébergée et rapporter les états
        shell: bash
        run: |
          set -euo pipefail
          found=0
          for url in "https://ventso-portfolio-v2.vercel.app/" "https://ventso.netlify.app/"; do
            status=$(curl -L -sS --connect-timeout 8 --max-time 20 -o /tmp/live-portfolio.html -w "%{http_code}" "$url" || true)
            bytes=$(wc -c </tmp/live-portfolio.html 2>/dev/null || echo 0)
            new="non"
            if grep -q "Des solutions web" /tmp/live-portfolio.html 2>/dev/null && grep -q "UptimePulse V2" /tmp/live-portfolio.html 2>/dev/null; then new="oui"; found=1; fi
            echo "$url | HTTP $status | HTML $bytes octets | V2 $new"
          done
          test "$found" = 1
