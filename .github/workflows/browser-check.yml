name: Recette navigateur du portfolio

on:
  push:
    branches:
      - draft/fullstack-remote-profile-2026
      - redesign/assistant-technique-it-2026
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Installer Playwright
        run: |
          npm install --no-save @playwright/test
          npx playwright install --with-deps chromium
      - name: Lancer un serveur statique local
        run: |
          python3 -m http.server 8000 --bind 127.0.0.1 >/tmp/portfolio-http.log 2>&1 &
          sleep 2
          curl -fsS http://127.0.0.1:8000/ >/dev/null
      - name: Tester les parcours utilisateur
        run: |
          mkdir -p artifacts
          npx playwright test tests/portfolio.spec.mjs --browser chromium --reporter=line
      - name: Conserver les captures et diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: captures-portfolio-responsive
          path: |
            artifacts/
            test-results/
          if-no-files-found: ignore
