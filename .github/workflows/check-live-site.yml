name: Vérifier la publication Netlify

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Contrôler la version du portfolio sur Netlify
        shell: bash
        run: |
          set -euo pipefail
          url="https://ventso.netlify.app/"
          http=$(curl -sS -L --connect-timeout 8 --max-time 20 -o /tmp/live.html -w "%{http_code}" "$url")
          echo "Site Netlify : $url | HTTP $http"
          test "$http" = "200"
          grep -q "Des solutions web" /tmp/live.html
          grep -q "UptimePulse V2" /tmp/live.html
          echo "Version V2 confirmée sur Netlify"
